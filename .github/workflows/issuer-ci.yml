name: CI SmartMeterIssuer

on:
  pull_request:
    branches: [main]
    paths:
      - 'SmartMeterIssuerSSI/**'
  push:
    paths:
      - 'SmartMeterIssuerSSI/**'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build .